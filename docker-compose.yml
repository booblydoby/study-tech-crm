services:
  postgres:
    image: postgres:16-alpine
    container_name: study-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: study_crm
      POSTGRES_USER: study
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study -d study_crm"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: study-crm-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://study:${POSTGRES_PASSWORD}@postgres:5432/study_crm?schema=public
      NODE_ENV: production
      SWAGGER_ENABLED: "false"
      WEB_ORIGIN: ${WEB_ORIGIN}
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: study-crm-web
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - .env
    ports:
      - "3000:3000"

volumes:
  postgres_data:
